# Detector de secretos (SEC-03).
# Corre en cada PR y en cada push a main. Falla el build si Gitleaks encuentra credenciales en el historial.
# Reglas: las de Gitleaks por defecto más las excepciones justificadas de .gitleaks.toml.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks sobre todo el historial
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml \
            --report-format sarif --report-path /dev/stdout > gitleaks.sarif || {
              echo "::error::Gitleaks encontró posibles secretos. Ver el reporte gitleaks.sarif."
              exit 1
            }

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
